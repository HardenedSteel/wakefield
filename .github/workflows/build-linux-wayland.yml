name: 'Build Wakefield (Wayland)'

on:
  workflow_dispatch:
  push:
    branches:
      - 'build-jdk-28+13'

jobs:
  build-linux-x64:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Install Build & Wayland Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf \
            build-essential \
            libasound2-dev \
            libcups2-dev \
            libfontconfig1-dev \
            libx11-dev \
            libxext-dev \
            libxrandr-dev \
            libxrender-dev \
            libxt-dev \
            libxtst-dev \
            libwayland-dev \
            wayland-protocols \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libegl1-mesa-dev \
            libgl1-mesa-dev

      - name: Setup Boot JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '26'

      - name: Configure OpenJDK with Wayland
        run: |
          bash configure \
            --with-debug-level=release \
            --with-jvm-variants=server \
            --with-boot-jdk="$JAVA_HOME" \
            --disable-warnings-as-errors

      - name: Compile JDK Image
        run: |
          make images

      - name: Archive Bundle and Compute SHA-256
        run: |
          cd build/linux-x86_64-server-release/images/
          tar -czvf wakefield-jdk-28-13-linux-x64.tar.gz jdk/
          sha256sum wakefield-jdk-28-13-linux-x64.tar.gz > wakefield-jdk-28-13-linux-x64.tar.gz.sha256
          mv wakefield-jdk-28-13-linux-x64.tar.gz* $GITHUB_WORKSPACE/

      - name: Upload JDK Release Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: jdk-28-13-release
          name: "OpenJDK Wakefield jdk-28+13 (Wayland)"
          files: |
            wakefield-jdk-28-13-linux-x64.tar.gz
            wakefield-jdk-28-13-linux-x64.tar.gz.sha256
