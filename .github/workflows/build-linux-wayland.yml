name: 'Build Wakefield (Wayland)'

on:
  workflow_dispatch:
    inputs:
      wakefield_ref:
        description: 'Wakefield Branch or Tag to build'
        required: true
        default: 'jdk-28+13'
        type: string
      boot_jdk_version:
        description: 'Boot JDK Version'
        required: true
        default: '26'
        type: string

jobs:
  build-linux-x64:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Resolve Version and Tag Names
        id: vars
        run: |
          RAW_REF="${{ github.event.inputs.wakefield_ref || 'jdk-28+13' }}"
          # Replace '+' and '/' with '-' for clean filenames and release tags
          CLEAN_TAG=$(echo "$RAW_REF" | tr '+' '-' | tr '/' '-')
          echo "raw_ref=$RAW_REF" >> $GITHUB_OUTPUT
          echo "clean_tag=$CLEAN_TAG" >> $GITHUB_OUTPUT

      - name: Checkout Source at Selected Ref
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.vars.outputs.raw_ref }}

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf \
            build-essential \
            libasound2-dev \
            libcups2-dev \
            libfontconfig1-dev \
            libx11-dev \
            libxext-dev \
            libxrandr-dev \
            libxrender-dev \
            libxt-dev \
            libxtst-dev \
            libwayland-dev \
            wayland-protocols \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libegl1-mesa-dev \
            libgl1-mesa-dev

      - name: Setup Boot JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: ${{ github.event.inputs.boot_jdk_version || '26' }}

      - name: Configure OpenJDK
        run: |
          bash configure \
            --with-debug-level=release \
            --with-jvm-variants=server \
            --with-boot-jdk="$JAVA_HOME" \
            --disable-warnings-as-errors

      - name: Compile JDK Image
        run: |
          make images

      - name: Package JDK and Compute SHA-256
        run: |
          cd build/linux-x86_64-server-release/images/
          
          TARBALL_NAME="wakefield-${{ steps.vars.outputs.clean_tag }}-linux-x64.tar.gz"
          tar -czvf "$TARBALL_NAME" jdk/
          sha256sum "$TARBALL_NAME" > "${TARBALL_NAME}.sha256"
          
          mv wakefield-* $GITHUB_WORKSPACE/

      - name: Display Checksum
        run: |
          cat wakefield-${{ steps.vars.outputs.clean_tag }}-linux-x64.tar.gz.sha256

      - name: Create Release and Upload
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.clean_tag }}
          name: "OpenJDK Wakefield ${{ steps.vars.outputs.raw_ref }} (Wayland)"
          files: |
            wakefield-${{ steps.vars.outputs.clean_tag }}-linux-x64.tar.gz
            wakefield-${{ steps.vars.outputs.clean_tag }}-linux-x64.tar.gz.sha256
